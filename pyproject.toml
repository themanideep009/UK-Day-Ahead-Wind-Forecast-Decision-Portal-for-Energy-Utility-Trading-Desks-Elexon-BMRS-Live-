[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-wind-forecast-decision-portal"
version = "0.1.0"
requires-python = ">=3.11, <3.13"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "httpx>=0.28.0",
    "tzdata>=2024.2",
]

[tool.setuptools.packages.find]
include = ["backend*", "api*"]



[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "node_modules", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [".venv", "node_modules", "dist"]
